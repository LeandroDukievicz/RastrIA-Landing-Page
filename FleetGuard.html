<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    /* light */
    --fg: oklch(0.22 0.015 250);
    --fg-2: oklch(0.45 0.012 250);
    --fg-3: oklch(0.62 0.010 250);
    --bg: oklch(0.985 0.003 250);
    --bg-2: oklch(0.965 0.005 250);
    --card: #ffffff;
    --border: oklch(0.91 0.005 250);
    --border-2: oklch(0.86 0.006 250);
    --primary: oklch(0.50 0.085 200);
    --primary-fg: #ffffff;
    --primary-soft: oklch(0.95 0.025 200);
    --primary-soft-fg: oklch(0.40 0.085 200);
    --ok: oklch(0.62 0.13 155);
    --ok-soft: oklch(0.95 0.04 155);
    --warn: oklch(0.74 0.15 75);
    --warn-soft: oklch(0.96 0.05 80);
    --danger: oklch(0.60 0.20 25);
    --danger-soft: oklch(0.96 0.04 25);
    --info: oklch(0.62 0.12 250);
    --info-soft: oklch(0.96 0.025 250);
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.08);
  }
  .theme-dark {
    --fg: oklch(0.96 0.005 250);
    --fg-2: oklch(0.78 0.008 250);
    --fg-3: oklch(0.58 0.010 250);
    --bg: oklch(0.18 0.012 250);
    --bg-2: oklch(0.22 0.013 250);
    --card: oklch(0.245 0.013 250);
    --border: oklch(0.30 0.012 250);
    --border-2: oklch(0.36 0.013 250);
    --primary: oklch(0.72 0.10 200);
    --primary-fg: oklch(0.18 0.012 250);
    --primary-soft: oklch(0.30 0.04 200);
    --primary-soft-fg: oklch(0.85 0.07 200);
    --ok: oklch(0.74 0.15 155);
    --ok-soft: oklch(0.30 0.06 155);
    --warn: oklch(0.80 0.16 75);
    --warn-soft: oklch(0.32 0.07 75);
    --danger: oklch(0.72 0.18 25);
    --danger-soft: oklch(0.32 0.08 25);
    --info: oklch(0.72 0.12 250);
    --info-soft: oklch(0.30 0.05 250);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: #0c0e12; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "ss01"; }
  .num { font-variant-numeric: tabular-nums; }

  /* iPhone frame */
  .device-stage {
    background:
      radial-gradient(1200px 700px at 30% 10%, rgba(56,118,140,0.12), transparent 60%),
      radial-gradient(900px 600px at 80% 90%, rgba(80,80,120,0.10), transparent 60%),
      #0c0e12;
  }
  .iphone {
    width: 390px;
    height: 844px;
    border-radius: 56px;
    background: #0a0a0c;
    padding: 12px;
    box-shadow:
      0 0 0 2px #1d1f25,
      0 0 0 8px #0e1014,
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 60px 120px -30px rgba(0,0,0,0.45);
    position: relative;
  }
  .iphone-screen {
    width: 100%; height: 100%;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    color: var(--fg);
  }
  .iphone-notch {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 50;
    pointer-events: none;
  }
  .status-bar {
    height: 54px;
    padding: 18px 28px 0 28px;
    display: flex; align-items: flex-start; justify-content: space-between;
    color: var(--fg);
    font-weight: 600;
    font-size: 15px;
    position: relative;
    z-index: 5;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 100px;
    background: rgba(0,0,0,0.35);
  }
  .theme-dark .home-indicator { background: rgba(255,255,255,0.4); }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--fg);
  }
  .screen-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .screen-body::-webkit-scrollbar { display: none; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.01em;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 14px; font-weight: 600; font-size: 15px;
    padding: 14px 18px; transition: transform .06s ease, opacity .15s ease, background .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--primary); color: var(--primary-fg); }
  .btn-ghost { background: var(--bg-2); color: var(--fg); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }

  .field {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px;
    color: var(--fg);
    width: 100%;
    font-size: 15px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field::placeholder { color: var(--fg-3); }
  .field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 18%, transparent); }

  .divider { height: 1px; background: var(--border); }

  /* Live pulse */
  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent); }
    70% { box-shadow: 0 0 0 10px color-mix(in oklab, var(--ok) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 0%, transparent); }
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--ok);
    animation: livePulse 1.6s infinite;
  }

  /* Pin pulse on map */
  @keyframes pinPulse {
    0% { transform: scale(1); opacity: .55; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .pin-pulse {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: var(--primary);
    animation: pinPulse 2s infinite;
  }

  /* Screen transition */
  .screen-enter { opacity: 0; transform: translateY(6px); }
  .screen-enter-active { opacity: 1; transform: translateY(0); transition: opacity .22s ease, transform .22s ease; }

  /* Map grid */
  .map-grid {
    background-color: var(--bg-2);
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  .tap { cursor: pointer; }
  .tap:active { opacity: 0.8; }

  /* hide focus outline globally inside the device, replace with field rule */
  .iphone *:focus { outline: none; }

  /* nav active indicator */
  .nav-item { position: relative; }
  .nav-item.active { color: var(--primary); }
  .nav-item .nav-label { font-size: 10px; font-weight: 600; }

  /* segmented */
  .seg {
    display: inline-flex; padding: 3px; background: var(--bg-2); border-radius: 10px; border: 1px solid var(--border);
  }
  .seg button {
    padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--fg-2); border-radius: 7px;
  }
  .seg button.active { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.05); }

  /* skeleton route stroke draw */
  @keyframes drawRoute {
    from { stroke-dashoffset: 800; }
    to { stroke-dashoffset: 0; }
  }
  .route-draw { stroke-dasharray: 800; stroke-dashoffset: 800; animation: drawRoute 2s ease forwards; }

  /* AI shimmer */
  @keyframes aiShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .ai-gradient-text {
    background: linear-gradient(90deg, var(--fg) 0%, var(--primary) 50%, var(--fg) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: aiShimmer 4s linear infinite;
  }

  /* small bouncy emergence */
  @keyframes pop {
    0% { transform: scale(0.96); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop .25s ease-out; }
</style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;

/* ---------------- Icons (Lucide) ---------------- */
function Icon({ name, size = 20, stroke = 1.75, className = "", style }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const el = document.createElement("i");
      el.setAttribute("data-lucide", name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { width: size, height: size, "stroke-width": stroke } , nameAttr: "data-lucide" });
    }
  }, [name, size, stroke]);
  return <span ref={ref} className={"inline-flex " + className} style={{ width: size, height: size, ...style }} />;
}

/* ---------------- Theme ---------------- */
const ThemeCtx = createContext(null);
function ThemeProvider({ children }) {
  const [dark, setDark] = useState(false);
  return (
    <ThemeCtx.Provider value={{ dark, setDark }}>
      <div className={dark ? "theme-dark" : ""} style={{ width: "100%", height: "100%" }}>{children}</div>
    </ThemeCtx.Provider>
  );
}
const useTheme = () => useContext(ThemeCtx);

/* ---------------- Mock Data ---------------- */
const VEHICLES = [

  { id: "v3", model: "Renault Kwid Zen", plate: "MGA-4B92", color: "Cinza", year: "2024", odo: 9870, status: "available", fuel: 92 },

];

const TRIPS = [

  { id: "t3", driver: "Rafael Tomé", vehicle: "Fiat Strada RBL-1C08", date: "Ontem", time: "16:24", duration: "3h 47min", distance: 92.1, status: "suspicious", from: "Maringá-PR", to: "Mandaguaçu-PR (não previsto)", avgSpeed: 64 },

/* ---------------- Helpers ---------------- */
function StatusChip({ status }) {
  const map = {
    available: { label: "Disponível", bg: "var(--ok-soft)", fg: "var(--ok)" },
    "in-use":   { label: "Em uso",     bg: "var(--info-soft)", fg: "var(--info)" },
    offline:    { label: "Offline",    bg: "var(--danger-soft)", fg: "var(--danger)" },
    completed:  { label: "Concluída",  bg: "var(--ok-soft)", fg: "var(--ok)" },
    "in-progress": { label: "Em andamento", bg: "var(--info-soft)", fg: "var(--info)" },
    suspicious: { label: "Suspeita",   bg: "var(--warn-soft)", fg: "var(--warn)" },
  };
  const m = map[status] || { label: status, bg: "var(--bg-2)", fg: "var(--fg-2)" };
  return <span className="chip" style={{ background: m.bg, color: m.fg }}>{m.label}</span>;
}

function SeverityDot({ s }) {
  const c = s === "high" ? "var(--danger)" : s === "med" ? "var(--warn)" : "var(--info)";
  return <span style={{ width: 8, height: 8, borderRadius: 999, background: c, display: "inline-block" }} />;
}

function StatusBar({ dark }) {

    <div className="status-bar">

        <Icon name="battery-full" size={20} stroke={2.2} />

}

        {/* secondary streets */}
        <g stroke="var(--border)" strokeWidth="6" fill="none">
          <path d="M-10,80 L420,90" />
          <path d="M-10,260 L420,255" />
          <path d="M-10,330 L420,335" />
          <path d="M-10,500 L420,500" />
          <path d="M170,-10 L180,650" />
          <path d="M340,-10 L345,650" />
        </g>
        {/* lane center dashes */}
        <g stroke="var(--card)" strokeWidth="1.5" strokeDasharray="6 8" fill="none" opacity="0.9">
          <path d="M-10,180 L420,150" />
          <path d="M-10,400 L420,420" />
          <path d="M70,-10 L100,650" />
          <path d="M280,-10 L260,650" />
        </g>
        {/* labels */}
        <g fontFamily="Inter" fontSize="9" fill="var(--fg-3)" fontWeight="500">
          <text x="14" y="146" transform="rotate(-2 14 146)">AV. COLOMBO</text>

          <text x="108" y="60" transform="rotate(88 108 60)">R. NEO ALVES MARTINS</text>
          <text x="268" y="60" transform="rotate(-88 268 60)">AV. MANDACARU</text>

        {withRoute && (

/* ---------------- Bottom Nav ---------------- */
function BottomNav({ active, onChange }) {
  const tabs = [
    { id: "home", label: "Início", icon: "house" },
    { id: "map", label: "Mapa", icon: "map" },
    { id: "history", label: "Histórico", icon: "list" },
    { id: "alerts", label: "Alertas", icon: "bell" },
    { id: "admin", label: "Frota", icon: "layout-grid" },
  ];
  return (
    <div style={{
      borderTop: "1px solid var(--border)",
      background: "var(--card)",
      paddingBottom: 18, paddingTop: 8,
    }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => onChange(t.id)}
            className={"nav-item tap " + (active === t.id ? "active" : "")}
            style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "6px 0",
              color: active === t.id ? "var(--primary)" : "var(--fg-3)" }}>
            <Icon name={t.icon} size={22} stroke={active === t.id ? 2.2 : 1.75} />
            <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------------- App Header ---------------- */
function ScreenHeader({ title, subtitle, back, right }) {
  return (
    <div style={{ padding: "8px 20px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
        {back && (
          <button onClick={back} className="tap" style={{
            width: 38, height: 38, borderRadius: 12, background: "var(--bg-2)", border: "1px solid var(--border)",

          }}>
            <Icon name="chevron-left" size={20} />
          </button>
        )}
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: "-0.01em", lineHeight: 1.1 }}>{title}</div>
          {subtitle && <div style={{ fontSize: 13, color: "var(--fg-3)", marginTop: 2 }}>{subtitle}</div>}
        </div>
      </div>
      <div style={{ display: "flex", gap: 8 }}>{right}</div>

function ScoreRing({ value }) {
  const r = 26, c = 2 * Math.PI * r;
  const off = c - (value / 100) * c;
  const color = value >= 80 ? "var(--ok)" : value >= 60 ? "var(--warn)" : "var(--danger)";
  return (
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r={r} stroke="var(--border)" strokeWidth="6" fill="none" />
      <circle cx="32" cy="32" r={r} stroke={color} strokeWidth="6" fill="none"
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform="rotate(-90 32 32)" />
    </svg>
  );
}
function ScoreItem({ icon, label, v, bad }) {
  return (
    <div style={{ background: "var(--bg-2)", borderRadius: 12, padding: 10, display: "flex", flexDirection: "column", gap: 4 }}>
      <Icon name={icon} size={14} stroke={2} style={{ color: bad ? "var(--warn)" : "var(--fg-2)" }} />

    </div>
  );
}

  return (
    <div className="screen">
      <StatusBar />
      <ScreenHeader title="Alertas" subtitle={list.length + " ativos · " + ALERTS.filter(a => a.severity === "high").length + " críticos"}

  );
}

/* ---------------- App Shell / Router ---------------- */
function App() {
  const [route, setRoute] = useState("login"); // login | home | checkout | map | history | trip | admin | alerts
  const [tab, setTab] = useState("home");
  const [tripId, setTripId] = useState("t1");
  const [vehicleInUse, setVehicleInUse] = useState(true);
  const theme = useTheme();

  const go = (r, payload) => {
    if (r === "trip") setTripId(payload || "t3");
    setRoute(r);
    if (["home","map","history","alerts","admin"].includes(r)) setTab(r);
  };

  const showNav = ["home","map","history","alerts","admin"].includes(route);

  // simple key prop for transition
  const screen = useMemo(() => {
    switch (route) {
      case "login":    return <ScreenLogin onLogin={() => { setRoute("home"); setTab("home"); }} />;
      case "home":     return <ScreenHome go={go} vehicleInUse={vehicleInUse} theme={theme} />;
      case "checkout": return <ScreenCheckout back={() => go("home")} onConfirm={() => { setVehicleInUse(true); go("map"); }} />;
      case "checkin":  return <ScreenCheckout back={() => go("home")} onConfirm={() => { setVehicleInUse(false); go("home"); }} />;
      case "map":      return <ScreenMap back={() => go("home")} go={go} />;
      case "history":  return <ScreenHistory go={go} />;
      case "trip":     return <ScreenTripDetail tripId={tripId} back={() => go("history")} />;
      case "admin":    return <ScreenAdmin go={go} theme={theme} />;
      case "alerts":   return <ScreenAlerts />;
      default: return null;
    }
  }, [route, tripId, vehicleInUse, theme.dark]);

  const onTab = (t) => {
    setTab(t);
    setRoute(t);
  };

  return (
    <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column" }}>
      <div key={route} style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column" }} className="screen-enter screen-enter-active">
        {screen}
      </div>
      {showNav && (
        <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, zIndex: 10 }}>
          <BottomNav active={tab} onChange={onTab} />
          <div className="home-indicator" />
        </div>
      )}
      {!showNav && route !== "login" && <div className="home-indicator" />}
      {route === "login" && <div className="home-indicator" />}
    </div>
  );
}
